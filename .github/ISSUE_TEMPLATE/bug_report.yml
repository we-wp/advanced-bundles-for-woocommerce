name: Bug report
description: Report a reproducible problem in the latest Free release.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove customer, order, credential, payment, and other private data. For security issues, use private vulnerability reporting instead.
  - type: input
    id: plugin_version
    attributes:
      label: Advanced Bundles version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress, WooCommerce, and PHP versions
      placeholder: WordPress 6.8, WooCommerce 9.9, PHP 8.2
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Cart and checkout type
      options:
        - Cart and Checkout Blocks
        - Classic cart and checkout
        - Both
        - Not related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use test products and numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest Free release.
          required: true
        - label: I removed private and production data.
          required: true
        - label: This is not a security vulnerability.
          required: true
